const avgOf=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
function spark(v){if(v.length<2)return '<span class="muted">—</span>';const w=84,h=26,mn=Math.min(...v,0),mx=Math.max(...v,0),sp2=(mx-mn)||1,pts=v.map((x,i)=>[i/(v.length-1)*(w-8)+4,h-4-(x-mn)/sp2*(h-8)]),zy=h-4-(0-mn)/sp2*(h-8),last=pts[pts.length-1];return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><title>${esc(v.map(x=>x.toFixed(1)+'%').join(', '))}</title><line x1="0" x2="${w}" y1="${zy}" y2="${zy}" stroke="#d5dce8" stroke-dasharray="3 3"/><polyline fill="none" stroke="#2563eb" stroke-width="1.8" points="${pts.map(p=>p.join(',')).join(' ')}"/><circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${v[v.length-1]<0?'#c0392b':'#16a34a'}"/></svg>`}
function reportData(){const caps=dbData.captures.filter(c=>(!filters.from||c.date>=filters.from)&&(!filters.to||c.date<=filters.to)).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')),by={},dr={};caps.forEach(c=>{const r=calc(c);if(!r)return;const y=ys(r);(by[c.recipe]=by[c.recipe]||[]).push({yp:y.yp,eff:y.batch||0});r.lines.forEach(l=>{if(!l.standardQty||l.deltaPct===null||l.deltaPct===undefined)return;const k=c.recipe+'|'+l.name;(dr[k]=dr[k]||{recipe:c.recipe,item:l.name,d:[],c:[]}).d.push(l.deltaPct);if(l.costDelta!==null&&l.costDelta!==undefined)dr[k].c.push(l.costDelta)})});const recipes=Object.entries(by).map(([name,a])=>{const v=a.map(x=>x.yp),n=v.length,avg=avgOf(v),abs=avgOf(v.map(Math.abs)),sd=n>1?Math.sqrt(v.reduce((s,x)=>s+(x-avg)**2,0)/(n-1)):null,score=abs+(sd||0),cls=score>=6?'High':score>=3?'Medium':'Low';let act='Stable, no action';if(n<2)act='Capture more batches';else if(sd>=3)act='Yield unstable: standardise the process';else if(Math.abs(avg)>=3)act=avg<0?'Consistent yield loss: revise the standard':'Consistent extra yield: tighten the standard';return{name,n,avg,abs,sd,min:Math.min(...v),max:Math.max(...v),score,cls,act,v,eff:a.reduce((s,x)=>s+x.eff,0)}}).sort((a,b)=>b.score-a.score),drift=Object.values(dr).map(x=>({recipe:x.recipe,item:x.item,avg:avgOf(x.d),n:x.d.length,cost:x.c.length?avgOf(x.c):null})).filter(x=>Math.abs(x.avg)>=0.05).sort((a,b)=>Math.abs(b.avg)-Math.abs(a.avg)).slice(0,10);return{recipes,drift}}
window.exportYieldReport=()=>{const{recipes}=reportData();downloadCsv('Yield_Variance_Report.csv',recipes.map((r,i)=>({Rank:i+1,Recipe:r.name,Batches:r.n,'Avg Yield Var %':r.avg.toFixed(2),'Fluctuation (std dev) %':r.sd===null?'':r.sd.toFixed(2),'Min %':r.min.toFixed(2),'Max %':r.max.toFixed(2),'Priority Score':r.score.toFixed(2),Priority:r.cls,'Total Batch Effect Rs':r.eff.toFixed(2),'Suggested Action':r.act})))};
function reportPage(){const{recipes,drift}=reportData(),high=recipes.filter(r=>r.cls==='High').length,tot=recipes.reduce((s,r)=>s+r.eff,0),bar=`<div class="dtop no-print"><div class="df"><label>From</label><input id="rpFrom" type="date" value="${filters.from}"></div><div class="df"><label>To</label><input id="rpTo" type="date" value="${filters.to}"></div><button class="btn" onclick="filters.from=document.getElementById('rpFrom').value;filters.to=document.getElementById('rpTo').value;render()">Apply</button><button class="btn" onclick="filters.from='';filters.to='';render()">Reset</button><div class="dsp"></div><button class="btn" onclick="exportYieldReport()">Export</button></div>`;if(!recipes.length)return `<div class="dash">${bar}<div class="panel"><div class="empty">No captured batches in this date range yet.</div></div></div>`;return `<div class="dash">${bar}<div class="metrics">${kpi('Recipes analysed',recipes.length,recipes.reduce((s,r)=>s+r.n,0)+' captured batches','▦')}${kpi('High priority',high,'Priority score 6 or more','⚑',high?'negative':'positive')}${kpi('Top priority',esc(recipes[0].name),'Score '+recipes[0].score.toFixed(1)+'% · '+recipes[0].cls,'↯')}${kpi('Total batch effect',sm(tot),'Saving / (loss) across all batches','₹',sc(tot))}</div><div class="panel"><div class="panel-head"><div><div class="panel-title">Recipes ranked by yield variance and fluctuation</div><div class="panel-sub">Yield variance = actual yield vs Prod Quantity. Score = average |variance| + fluctuation (std dev). High ≥ 6, Medium 3 to 6.</div></div></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Recipe</th><th>Batches</th><th>Avg yield var</th><th>Fluctuation (σ)</th><th>Range</th><th>Trend</th><th>Batch effect ₹</th><th>Priority</th><th>Suggested action</th></tr></thead><tbody>${recipes.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td>${r.n}</td><td class="${sc(r.avg)}"><b>${sp(r.avg)}</b></td><td>${r.sd===null?'—':r.sd.toFixed(1)+'%'}</td><td>${r.n
